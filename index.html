<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Управление страницами в конструкторе</title>
  <link rel="stylesheet" href="vendor/tokens.css">
  <link rel="stylesheet" href="vendor/button.css">
  <link rel="stylesheet" href="vendor/tumbler.css">
  <link rel="stylesheet" href="vendor/close-button.css">
  <link rel="stylesheet" href="vendor/builder-header.css">
  <link rel="stylesheet" href="vendor/input.css">
  <link rel="stylesheet" href="vendor/switch.css">
  <link rel="stylesheet" href="vendor/chips.css">
  <link rel="stylesheet" href="vendor/property-editor.css">
  <link rel="stylesheet" href="vendor/left-sidebar.css">
  <link rel="stylesheet" href="vendor/right-sidebar.css">
  <link rel="stylesheet" href="vendor/demo-frame.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="page-panel.css">
  <script src="vendor/builder-header.js" defer></script>
  <script src="vendor/demo-frame.js" defer></script>
  <script src="vendor/left-sidebar.js" defer></script>
  <script src="panel-messages.js" defer></script>
  <script src="app.js" defer></script>
  <script src="page-panel.js" defer></script>
</head>
<body>
  <div class="builder" id="demo-stage">
    <header id="builder-header" aria-label="Шапка конструктора"></header>
    <div class="workspace">
      <aside class="lsb" aria-label="Страницы"><div class="lsb__lines" aria-hidden="true"></div><div class="lsb__panel"><header class="lsb__head"><div class="lsb__title"><h3 class="lsb__name">Страницы</h3><button type="button" class="btn btn--filled btn--style-pale btn--size-m" data-lsb-add aria-label="Добавить страницу"><span class="btn__icon" aria-hidden="true">&#xeadd;</span></button></div><div class="lsb__toggle"><button type="button" class="btn btn--filled btn--style-pale btn--icon" aria-label="Свернуть панель"><span class="btn__icon" aria-hidden="true">&#xebfa;</span></button></div></header><div class="lsb__list"></div></div><div class="lsb__menu" role="menu" aria-label="Действия" hidden><div class="lsb__menu-top"><div class="lsb__menu-head">Действия</div><button type="button" class="close-button close-button--link-button lsb__menu-close" aria-label="Закрыть"></button></div><button type="button" class="lsb__menu-item" role="menuitem" data-lsb-act="home"><span class="lsb__menu-icon" aria-hidden="true">&#xe64c;</span><span class="lsb__menu-text">Сделать главной</span></button><button type="button" class="lsb__menu-item" role="menuitem" data-lsb-act="settings"><span class="lsb__menu-icon" aria-hidden="true">&#xe61b;</span><span class="lsb__menu-text">Настроить</span></button><button type="button" class="lsb__menu-item" role="menuitem" data-lsb-act="link"><span class="lsb__menu-icon" aria-hidden="true">&#xe6a7;</span><span class="lsb__menu-text">Скопировать ссылку</span></button><button type="button" class="lsb__menu-item" role="menuitem" data-lsb-act="duplicate"><span class="lsb__menu-icon" aria-hidden="true">&#xe669;</span><span class="lsb__menu-text">Дублировать</span></button><button type="button" class="lsb__menu-item" role="menuitem" data-lsb-act="hide"><span class="lsb__menu-icon" aria-hidden="true">&#xe651;</span><span class="lsb__menu-text">Скрыть</span></button><button type="button" class="lsb__menu-item lsb__menu-item--danger" role="menuitem" data-lsb-act="delete"><span class="lsb__menu-icon" aria-hidden="true">&#xeb72;</span><span class="lsb__menu-text">Удалить</span></button></div><section class="pe lsb__settings" aria-label="Настройки страницы" hidden><header class="pe__head"><label class="pe__name"><input class="pe__name-input" aria-label="Название страницы"></label><div class="pe__cmds"><button type="button" class="pe__reset" aria-label="Сбросить настройки">&#xe629;</button><button type="button" class="pe__done" aria-label="Сохранить">&#xe75e;</button><button type="button" class="pe__close" aria-label="Закрыть">&#xe66c;</button></div></header><div class="pe__body"><div class="pe__card"><div class="pe__rows"><div class="pe__row"><span class="pe__label">Адрес</span><span class="lsb__addr">/<label class="input input--size-l"><span class="input__body"><span class="input__field"><input class="input__control" data-lsb-field="addr" aria-label="Адрес страницы"></span></span></label></span></div><div class="pe__row"><span class="pe__label">Доступ</span><button type="button" class="btn btn--link btn--style-link btn--size-m lsb__value" data-lsb-pick="access" aria-haspopup="menu" aria-expanded="false"></button></div></div><label class="switch switch--caption-start lsb__index"><input class="switch__input" type="checkbox" role="switch" data-lsb-field="noindex"><span class="switch__button"></span><span class="switch__caption">Запретить поисковую индексацию</span></label></div><div class="pe__card"><div class="pe__rows"><div class="pe__row"><span class="pe__label">Способ отображения</span><button type="button" class="btn btn--link btn--style-link btn--size-m lsb__value" data-lsb-pick="mode" aria-haspopup="menu" aria-expanded="false"></button></div></div></div><div class="pe__card" data-pe-row="seo" hidden><div class="lsb__seo"><div class="pe__title">SEO<button type="button" class="pe__x" data-pe-clear aria-label="Убрать SEO">&#xe66c;</button></div><div class="lsb__seo-fields"><label class="input input--label-top"><span class="input__label">Заголовок</span><span class="input__body"><span class="input__field"><input class="input__control" data-lsb-field="seo"></span></span></label><button type="button" class="btn btn--filled btn--style-pale btn--size-m" data-lsb-description-add aria-expanded="false">Описание</button><label class="input input--label-top input--textarea" data-lsb-description hidden><span class="input__label">Описание</span><span class="input__body"><span class="input__field"><textarea class="input__control" rows="3" data-lsb-field="seoDescription" aria-label="SEO-описание"></textarea></span></span></label></div></div></div><div class="pe__chips"><button type="button" class="chips chips--optional" data-pe-chip="seo"><span class="chips__caption">SEO</span></button></div></div><div class="lsb__pick" data-lsb-pick-menu="access" role="menu" aria-label="Доступ" hidden><div class="lsb__pick-list"><div class="lsb__pick-head"><span class="lsb__pick-title">Доступ</span><button type="button" class="close-button close-button--link-button lsb__pick-close" aria-label="Закрыть"></button></div><button type="button" class="lsb__pick-item" role="menuitemradio" aria-checked="true" data-value="public"><span class="lsb__pick-text">Без авторизации</span></button><button type="button" class="lsb__pick-item" role="menuitemradio" aria-checked="false" data-value="authorized"><span class="lsb__pick-text">Только авторизованным</span></button></div></div><div class="lsb__pick" data-lsb-pick-menu="mode" role="menu" aria-label="Способ отображения" hidden><div class="lsb__pick-list"><button type="button" class="close-button close-button--external lsb__pick-close" aria-label="Закрыть"></button><button type="button" class="lsb__pick-item" role="menuitemradio" aria-checked="true" data-value="page"><span class="lsb__pick-text">На странице</span></button><button type="button" class="lsb__pick-item" role="menuitemradio" aria-checked="false" data-value="window"><span class="lsb__pick-text">В новом окне</span></button><button type="button" class="lsb__pick-item" role="menuitemradio" aria-checked="false" data-value="both"><span class="lsb__pick-text">В окне и на странице</span></button></div></div></section></aside>
      <main aria-label="Рабочая область конструктора">
        <section class="booking-preview" aria-label="Статичная страница виджета записи">
          <div class="axure-canvas">
            <img class="axure-bg axure-bg-left" src="axure/u458.png" alt="">
            <img class="axure-bg axure-bg-middle" src="axure/u374.png" alt="">
            <img class="axure-bg axure-bg-right" src="axure/u459.png" alt="">
            <div class="axure-brand"><img src="axure/u489.png" alt=""><span>Незнакомка</span></div>
            <span class="axure-close" aria-hidden="true">&#xe66c;</span>
            <img id="booking-page" class="axure-page" src="axure/u510.png" width="600" height="768" alt="Специалисты — статичный экран из макета Axure">
          </div>
        </section>
        <section class="kiosk-preview" aria-label="Статичный контент киоска" hidden>
          <svg class="kiosk-static" viewBox="1314 126 740 1316" width="740" height="1316" role="img" aria-label="Главная киоска: фон с товарами, место для фотографии и Название">
            <image href="axure/kiosk-reference.png" width="2862" height="1464" aria-hidden="true"/>
          </svg>
        </section>
        <section class="survey-preview" aria-label="Статичный контент опроса" hidden>
          <svg class="survey-static" viewBox="776 126 1492 1326" width="1492" height="1326" role="img" aria-label="Опрос для запуска новой розничной точки: ассортимент товаров и инструменты увеличения продаж">
            <image href="axure/survey-reference.png" width="2418" height="1454" aria-hidden="true"/>
          </svg>
        </section>
      </main>
      <aside class="rsb" aria-label="Инструменты конструктора">
        <div class="rsb__bar">
          <div class="rsb__items">
            <button type="button" class="rsb__item rsb__item--shop" aria-label="Магазин" title="Магазин"><span class="rsb__icon" aria-hidden="true">&#xeadd;</span></button>
            <button type="button" class="rsb__item" aria-label="Данные" title="Данные"><span class="rsb__icon" aria-hidden="true">&#xebbc;</span></button>
            <button type="button" class="rsb__item" aria-label="Слои" title="Слои"><span class="rsb__icon" aria-hidden="true">&#xebf9;</span></button>
          </div>
          <div class="rsb__dock"><button type="button" class="btn btn--filled btn--style-pale btn--size-xl btn--icon" aria-label="Развернуть панель"><span class="btn__icon" aria-hidden="true">&#xebfa;</span></button></div>
          <div class="rsb__informers"><button type="button" class="rsb__help" aria-label="Помощь">?</button></div>
        </div>
      </aside>
    </div>
    <div id="feedback" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
